# blueprint.yaml —— 项目声明（唯一事实源之一）
# 严格模式：未知字段应报错，不要靠静默忽略过日子。
# 校验：python tools/blueprint_verify.py

version: 1
project: prompt
tier: S                  # S | M | L
stack: python            # ts | python | rust | generic

# 入口命令：每条都必须真实存在，verify 会核对；不存在的命令不要写进来
entrypoints:
  install: 'python -c "import qdoctor"'
  build: "python -m compileall -q qdoctor"
  dev: "python -m qdoctor serve"
  test: "python -m unittest discover -s tests -t . -v"
  lint: "python tools/check_layers.py"

git:                            # 托管：GitHub 主仓库，公司 Gitea 镜像；verify 会核对 .git/config
  hosts:
    - host: github.com
      owner: Joker123555
      url: https://github.com/Joker123555/prompt.git
    - host: git.zxyuanyu.com
      owner: lijin
      url: https://git.zxyuanyu.com/lijin/prompt.git

docs:
  root: docs
  entry: docs/index.md

modules:                        # verify 会扫描这些目录下的 MODULE.yaml
  # S 档：先只靠目录与 AGENTS.md，等模块边界稳定后再加

verify:
  # 这些路径是被引用但允许不存在（生成物、约定目录、第三方缓存）
  allow_missing:
    - "artifacts/"
    - "dist/"
    - "build/"
    - "target/"
    - "node_modules/"
    - ".git/"
